name: Bug report
description: Report a reproducible problem in Total Free Convert
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ...
        2. Select ...
        3. Click ...
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser or desktop app version
      placeholder: Firefox 156 / Windows desktop 1.3.0
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: Windows 11 / Linux / Android
  - type: textarea
    id: notes
    attributes:
      label: Additional details
      description: Do not upload private or sensitive images.
