name: Feature request
description: Suggest an improvement for Total Free Convert
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to add or change?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why would this be useful?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
